name: Naver Financial Report Hub

on:
  schedule:
    # 07:20 Asia/Taipei (GitHub Actions cron uses UTC)
    - cron: '20 23 * * *'
  workflow_dispatch:

concurrency:
  group: financial-report-hub-naver-publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Scrape Naver reports
        run: python -u main.py
        env:
          NAVER_REPORT_WINDOW_DAYS: '15'

      - name: Merge PDFs by source
        run: python merge_pdfs.py

      - name: Build NotebookLM HTML and text sources
        run: python build_merged_plain_text_html.py

      - name: Check generated PDF sizes
        run: python check_generated_pdf_sizes.py

      - name: Commit report hub outputs
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ index.html "all report pdf/" merged_pdfs/ merged_plain_text_html/
          git add main.py boilerplate_filter.py merge_pdfs.py check_generated_pdf_sizes.py build_merged_plain_text_html.py download_pdf.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update Naver reports and NotebookLM sources"
          git pull --rebase --autostash origin main
          git push

      - name: Upload report list CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-report-list-${{ github.run_id }}
          path: data/reports.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p _site/data _site/merged_plain_text_html
          cp index.html _site/index.html
          cp -R data/. _site/data/
          cp -R merged_plain_text_html/. _site/merged_plain_text_html/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
