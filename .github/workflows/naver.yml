name: Naver Research Reports

on:
  schedule:
    # 07:20 Asia/Taipei (GitHub Actions cron uses UTC)
    - cron: '20 23 * * *'
  workflow_dispatch:

concurrency:
  group: naver-research-reports
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scrape Naver reports and download new PDFs
        run: python -u main.py
        env:
          NAVER_REPORT_WINDOW_DAYS: '10'

      - name: Commit report state
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/reports.json
          if git diff --cached --quiet; then
            echo "No report-state changes"
            exit 0
          fi
          git commit -m "Update Naver report state"
          git pull --rebase --autostash origin main
          git push

      - name: Upload report list and new PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-reports-${{ github.run_id }}
          path: |
            data/reports.csv
            downloads/*.pdf
          if-no-files-found: warn
          retention-days: 14
